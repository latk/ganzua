[project]
name = "ganzua"
version = "0.4.0"  # do not edit manually, use `scripts/bump_version.py`
description = "extract dependency information from lockfiles"
readme = "README.md"
authors = [
    { name = "Lukas Atkinson", email = "opensource@LukasAtkinson.de" },
]
license = "Apache-2.0"
keywords = ["poetry", "uv", "dependency", "requirements", "packaging", "dependabot"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Intended Audience :: Developers",
]
requires-python = ">=3.13"  # also update justfile (multitest), .github/workflows/{release,test}.yaml
dependencies = [
    "click>=8.5.1",
    "httpx2>=2.16.0",
    "packaging>=26.3",
    "pydantic>=2.14.3",
    "rich>=15.0.0",
    "tomlkit>=0.15.2",
    "typing-extensions>=4.16.0",
    "yarl>=1.25.1",
]

[project.scripts]
ganzua = "ganzua.cli:app"

[project.urls]
Repository = "https://github.com/latk/ganzua"
Documentation = "https://ganzua.latk.de"
Changelog = "https://ganzua.latk.de/changelog.html"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "dirty-equals>=0.11",
    "inline-snapshot>=0.36.2",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "pytest-recording>=0.14.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv.workspace]
exclude = ["tests/*", "corpus/*"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/",
  "/tests/",
  "CHANGELOG.md",
]

[tool.ruff.lint]
select = [
  "ANN",  # type annotations
  "ARG",  # unused arguments
  "B",  # bugbear
  "C4",  # comprehensions
  "C90",  # mccabe complexity
  "D",  # pydocstyle
  "E",  # pycodestyle
  "F",  # pyflakes
  "G",  # logging
  "I",  # isort
  "LOG",  # logging
  "N", # naming
  "PERF",
  "PLC",  # pylint conventions
  "PLE",  # pylint errors
  "PLR",  # pylint refactor
  "PT", # pytest
  "PTH",  # use pathlib
  "RET",  # return and control flow
  "RUF100",  # unused-noqa
  "S",  # bandit
  "SIM",  # simplify
]
ignore = [
  "D104",  # undocumented-public-package
  "S603",  # subprocess-without-shell-equals-true, usually safe
  "E501",  # line-too-long, should be handled by `ruff format`
  "RET503",  # implicit-return, better handled by Mypy
  "SIM102",  # collapsible-if, separate statements are actually good for measuring coverage
  "SIM114",  # if-with-same-arms, useful for measuring coverage
]
pydocstyle.convention = "google"
pylint.max-returns = 10

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["D100"]
"tests/test_**.py" = [
  "S101",  # tests may use `assert`
  "D103",  # test functions don't need docstrings
]
"corpus/**.py" = ["D100"]
"scripts/**.py" = [
  "D100",  # scripts do not need module docstrigns
  "S607",  # scripts run on the local system, so PATH problems are less relevant
]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
disallow_untyped_defs = true
implicit_reexport = false
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = [
  "--import-mode=importlib",
  "--doctest-modules",
  "--cov-fail-under=100",
]
testpaths = ["src", "tests"]

[tool.inline-snapshot]
format-command = "ruff format --stdin-filename {filename}"

[tool.coverage]
run.source_dirs = ["src", "tests"]
run.branch = true
report.show_missing = true
report.exclude_also = [
  # Exclude `typing.assert_never()` lines, or blocks containing such lines.
  '(:\n[ ]+)?\bt\.assert_never\(other\)',
  # Exclude `raise NotImplementedError` lines, or blocks containing such lines.
  # Treat SchemaNotSupportedError as equivalent.
  '(:\n^[ ]+)?\braise (NotImplementedError|SchemaNotSupportedError)\b',
  # Exclude type-only definitions.
  '\bif t\.TYPE_CHECKING:$',
  # Exclude abstract protocol members.
  '\bdef \w+\([^\)]+\) -> [^:\n]: \.\.\.$',
]
